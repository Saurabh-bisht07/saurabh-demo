version: "3.9"

services:
  db:
    image: postgres:15-alpine
    container_name: donation_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-donation}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-donation_password}
      POSTGRES_DB: ${POSTGRES_DB:-donation_db}
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    container_name: donation_backend
    depends_on:
      - db
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://${POSTGRES_USER:-donation}:${POSTGRES_PASSWORD:-donation_password}@db:5432/${POSTGRES_DB:-donation_db}}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      TWILIO_SID: ${TWILIO_SID:-}
      TWILIO_TOKEN: ${TWILIO_TOKEN:-}
      TWILIO_FROM: ${TWILIO_FROM:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build: ./frontend
    container_name: donation_frontend
    depends_on:
      - backend
    environment:
      - VITE_API_BASE_URL=${VITE_API_BASE_URL:-http://localhost:8000}
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/usr/src/app
    command: sh -c "npm install && npm run dev -- --host"

volumes:
  db-data: